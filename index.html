<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5efe2">
<title>今天必须准时下班</title>
<style>
  :root{color-scheme:light;--paper:#f5efe2;--ink:#25251e;--muted:#625c50;--line:#d6cbbb;--accent:#ac3724;--yellow:#ffd364;--night:#282820}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation}
  button:focus-visible,a:focus-visible{outline:3px solid #a73725;outline-offset:4px}
  h1,h2,p{margin:0}
  [hidden]{display:none!important}
  .shell{width:min(100% - 36px,960px);margin:auto}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:69px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800}
  .badge{width:26px;height:26px;display:grid;place-items:center;background:var(--yellow);border:1px solid var(--ink);border-radius:7px;font-size:17px}
  .quiet{border:0;background:transparent;min-height:44px;padding:0 6px;font-size:13px;color:var(--muted)}
  main{display:grid;grid-template-columns:.87fr 1.13fr;gap:26px;padding:34px 0 26px;align-items:start}
  .clock-card{overflow:hidden;border:1px solid var(--night);border-radius:22px;background:var(--night);color:#fff5df}
  .clock-info{padding:20px 22px 14px;display:flex;justify-content:space-between;align-items:end;gap:10px}
  .clock-label{font-size:12px;color:#ead8af}
  .time{font:bold clamp(46px,7vw,82px)/.97 "Courier New",monospace;letter-spacing:-.08em;color:var(--yellow);white-space:nowrap}
  .deadline{border:1px solid #766a50;border-radius:99px;padding:4px 9px;font-size:11px;white-space:nowrap}
  .scene{display:block;width:100%;height:auto;background:#e68d67}
  .side-copy{padding:15px 22px 19px;font-size:13px;color:#ead8af}
  .play{border:1px solid var(--line);border-radius:22px;background:#fffaf0;padding:24px;box-shadow:0 5px 0 #e8ddca;min-width:0}
  .progress-label{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:8px}
  .segments{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:22px}
  .segments span{height:5px;border-radius:5px;background:#e9e0d2}
  .segments .done{background:var(--ink)}
  .segments .current{background:var(--accent)}
  .location{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.06em;margin-bottom:5px}
  h1,h2{font-weight:900;line-height:1.2;overflow-wrap:anywhere}
  h1{font-size:clamp(25px,4vw,42px);margin-bottom:10px}
  h2{font-size:clamp(24px,3.5vw,34px);margin-bottom:10px}
  .intro{font-size:14px;color:var(--muted);margin-bottom:18px}
  .choices,.actions{display:grid;gap:9px}
  .choice,.primary,.secondary{border:1px solid var(--ink);border-radius:11px;min-height:49px;padding:10px 13px;background:#fffdf7;text-align:left;font-weight:750}
  .choice{display:grid;grid-template-columns:29px 1fr auto;gap:9px;align-items:center;font-size:14px}
  .choice .letter{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;background:#eee4d4;font:bold 14px "Courier New",monospace}
  .choice .arrow{color:var(--muted)}
  .primary{background:var(--yellow);text-align:center;box-shadow:0 3px 0 var(--ink);width:100%}
  .secondary{text-align:center;border-color:var(--line);font-size:14px}
  @media(hover:hover){.choice:hover,.secondary:hover{background:#f9e8bc}.primary:hover{background:#ffdf83}.quiet:hover{text-decoration:underline}}
  .choice:active,.primary:active{transform:translateY(2px)}
  .receipt{border:1px dashed #b9a78b;background:#f7eedc;border-radius:12px;padding:17px;margin:15px 0 20px}
  .receipt b{display:block;color:var(--accent);font-size:14px;margin-bottom:5px}
  .ending-card{background:#2a2921;color:#fff4d8;border-radius:15px;padding:19px;margin:0 0 16px;border-top:5px solid var(--yellow)}
  .ending-card .location{color:#ffd364}
  .ending-card .result-time{font:bold 38px/1 "Courier New",monospace;color:var(--yellow);margin:10px 0}
  .ending-card p:last-child{font-size:14px}
  .actions{grid-template-columns:1fr 1fr}
  .actions .primary{grid-column:1/-1;margin-bottom:4px}
  .status{font-size:13px;color:var(--muted);margin-top:10px}
  textarea{width:100%;margin-top:8px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fffdf7}
  footer{border-top:1px solid var(--line);padding:11px 0 20px;color:var(--muted);font-size:12px}
  @media(max-width:690px){
    header{min-height:55px}
    main{grid-template-columns:1fr;gap:14px;padding:14px 0 20px}
    .clock-card{display:grid;grid-template-columns:1fr .75fr;min-height:106px;border-radius:16px}
    .clock-info{display:grid;align-content:center;justify-content:start;padding:10px 13px;gap:3px}
    .time{font-size:46px}
    .deadline{padding:1px 7px;justify-self:start}
    .scene{height:100%;min-height:106px;object-fit:cover;object-position:62% center}
    .side-copy{display:none}
    .play{padding:17px;border-radius:16px}
    .segments{margin-bottom:16px}
  }
  @media(max-width:350px){.shell{width:calc(100% - 22px)}.play{padding:13px}.clock-card{grid-template-columns:1fr .62fr}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><span class="badge" aria-hidden="true">↗</span> 今天必须准时下班</div>
    <button type="button" class="quiet" id="reset" hidden>↻ 重新开始</button>
  </header>
  <main>
    <aside class="clock-card" aria-label="游戏时钟">
      <div class="clock-info">
        <div><p class="clock-label">办公室时钟</p><p class="time" id="time">17:55</p></div>
        <p class="deadline" id="deadline">距下班 5 分钟</p>
      </div>
      <canvas id="office" class="scene" width="420" height="257" role="img" aria-label="夕阳照进办公室，桌上摆着咖啡，包已经收好"></canvas>
      <p class="side-copy">18:00 前（含）打卡即算准时。时间只会随选择推进。</p>
    </aside>
    <section class="play" id="play" aria-label="游戏剧情"></section>
  </main>
  <footer>办公室逃脱小游戏 · 每局 7 次选择</footer>
</div>
<script>
'use strict';

const gameTitle = '今天必须准时下班';
const startTime = 17 * 60 + 55;
const closingTime = 18 * 60;
const total = 7;
const endings = {
  free: {title:'准时下班，认证成功', line:'闸机一响，工牌归工牌，你归你。'},
  boss: {title:'老板的「两分钟」', line:'两分钟过后，老板翻到了第二页。全稿共四十七页。'},
  desk: {title:'人形打印机', line:'打印机已经休眠，只有你还在自动双面输出。'},
  call: {title:'会议室永久住户', line:'会议结束前，大家决定约个会讨论这次会议。'},
  admin: {title:'系统说你还在岗', line:'工位空了，考勤页面还在刷新。行政给你发了一个加油表情。'}
};

// 选项包含动作、耗时、反馈和陷阱类型。首题额外指定下一幕。
const scenes = {
  ping: {place:'工位 · 老板私聊', title:'老板：「在吗？」', body:'包都拉上拉链了，手机突然一震。你怎么回？', options:[
    ['在的，您说。',2,'老板秒回：「太好了，来我这儿看两页。」你已经读完第一页的标题。','boss','deck'],
    ['我正准备下班，急事可以直接发我。',0,'老板说是明早要用的材料。你约好明早过一遍，隔壁同事却探出了头。',null,'printer'],
    ['发一个「马上到」的表情。',1,'老板没说去哪儿，但顺手把你拉进了正在进行的语音会议。','call','call']
  ]},
  deck: {place:'老板办公室', title:'PPT 只剩一点点', body:'老板指着第 2 页，说「顺手统一一下格式」。左下角显示 47 页。', options:[
    ['先确认明早的交付时间，约好再改。',0,'老板看了一眼日历：对哦，明天才用。'],
    ['打开母版，争取一键修好。',3,'母版有六套。你改完一套，老板说还是旧的好。','boss'],
    ['先把第二页的标题挪两毫米。',1,'挪完老板很满意，又问能不能试试往回挪一毫米。','boss']
  ]},
  printer: {place:'打印区', title:'「顺手帮我打一下」', body:'同事给你一个文件。名字叫《最终版_真最终_就打一份》，一共 86 页。', options:[
    ['点打印，等第一页出来就走。',3,'第一页没出来，先出来了一个「卡纸」图标。','desk'],
    ['问他要哪几页，顺手指给他最近的打印机。',0,'同事发现只要签字页，拿着手机去自助打印了。'],
    ['发到另一台机器，顺路取。',1,'那台机器在隔壁楼。好消息是已经有人帮你签收了。','desk']
  ]},
  call: {place:'临时语音会议', title:'「大家听得到吗？」', body:'会议里九个人，有三个人同时说自己没声音。老板问你能不能先记一下纪要。', options:[
    ['共享屏幕，帮大家排查麦克风。',3,'所有人的麦克风都好了，于是所有人都开始说话。','call'],
    ['先记下来，等主持人说散会。',2,'主持人说「我就补充一点」，然后打开了白板。','call'],
    ['问清议题，把相关资料发群里再退出。',0,'主持人收到资料，让你明早补看群里的结论。']
  ]},
  calendar: {place:'走廊 · 日历提醒', title:'17:58 的「快速同步」', body:'一个临时会议邀请跳出来。说明只有三个字：很快的。', options:[
    ['接受，看看怎么个快法。',3,'主持人让大家先用一分钟自我介绍。参会人数：十二。','call'],
    ['留言问是否有需要今天拍板的事。',0,'组织者回「没有」，然后把会议挪到了明早。'],
    ['先加入，找个合适的时机离开。',2,'你刚关摄像头，主持人就说「下面请你来说两句」。','call']
  ]},
  file: {place:'办公群', title:'到底哪个才是最终版？', body:'同事问最终稿在哪。群里躺着「最终」「最新最终」和「这个才是最终」。', options:[
    ['发共享文档链接，标出确认过的版本。',0,'对方点了个赞。群里终于只有一个「最终」。'],
    ['把三个附件都发过去。',2,'同事问了三个问题，每个问题都以「所以」开头。','desk'],
    ['重新导出一份，命名为「绝对最终」。',3,'进度卡在 99%。群里已经出现了「绝对最终2」。','desk']
  ]},
  lift: {place:'电梯厅', title:'电梯门快关了', body:'电梯里有老板，旁边是楼梯。老板举起手机，像是想给你看个东西。', options:[
    ['伸手挡门，一起下楼。',2,'老板给你看了一条客户语音，时长 1:59。','boss'],
    ['等下一班，顺手看看工作群。',2,'你点开了群公告。电梯上去又下来，手机还没放下。','desk'],
    ['挥手道别，走楼梯。',1,'四层楼，一分钟。唯一追上你的是自己的脚步声。']
  ]},
  gate: {place:'一楼 · 闸机口', title:'今天的最后一道门', body:'闸机和门口的考勤平板都亮着。平板上弹出一个「完善个人信息」窗口。', options:[
    ['按提示补齐资料再提交。',3,'你填到紧急联系人，才发现滚动条还有半米长。','admin'],
    ['返回考勤主页，扫码打卡。',0,'「滴」的一声，屏幕终于写出了你今天最想看的两个字：已签。'],
    ['直接刷工牌出去，再回来补打卡。',2,'门开了，打卡没记上。前台请你走一遍访客登记。','admin']
  ]}
};
const order = ['ping', 'branch', 'calendar', 'file', 'lift', 'message', 'gate'];
scenes.message = {place:'一楼 · 大厅', title:'手机又亮了', body:'老板把明早要说的事发过来了，末尾写着「有空看一下」。闸机就在前面。', options:[
  ['当场看完，顺手回一版修改意见。',4,'老板回复了一个竖起的大拇指，紧接着又发来三条语音。','boss'],
  ['点开语音，听完再走。',2,'第一条语音最后一句是「后面那条更重要」。','boss'],
  ['把消息标为待办，收起手机。',0,'你把明天的事留给明天，径直走向闸机。']
]};

function newGame() {
  return {minute:startTime, step:0, branch:null, traps:{}, latest:null};
}

function choose(state, index) {
  const key = order[state.step] === 'branch' ? state.branch : order[state.step];
  const [label, cost, feedback, trap, branch] = scenes[key].options[index];
  const traps = {...state.traps};
  if (trap) traps[trap] = (traps[trap] || 0) + cost;
  return {
    minute:state.minute + cost, step:state.step + 1, branch:branch || state.branch,
    traps, latest:trap || state.latest, cost, feedback
  };
}

function endingFor(state) {
  if (state.minute <= closingTime) return 'free';
  const largest = Math.max(...Object.values(state.traps));
  if (state.traps[state.latest] === largest) return state.latest;
  return Object.keys(state.traps).find(key => state.traps[key] === largest);
}

const byId = id => document.getElementById(id);
const play = byId('play');
const clock = minute => String(Math.floor(minute / 60)).padStart(2,'0') + ':' + String(minute % 60).padStart(2,'0');
let game = newGame();

function drawOffice() {
  const ctx = byId('office').getContext('2d');
  const rect = (x,y,w,h,color) => {ctx.fillStyle=color;ctx.fillRect(x,y,w,h);};
  const sunset = ctx.createLinearGradient(0,0,0,200);
  sunset.addColorStop(0,'#db775e');
  sunset.addColorStop(1,'#ffcc83');
  rect(0,0,420,257,'#b55b49');
  rect(19,14,382,191,sunset);
  ctx.fillStyle='#ffe29c';
  ctx.beginPath();ctx.arc(310,78,46,0,Math.PI*2);ctx.fill();
  [[22,119,39],[65,143,48],[117,100,53],[176,131,34],[216,150,63],[284,117,47],[337,143,62]].forEach(([x,y,w],i)=>{
    rect(x,y,w,205-y,i%2?'#a25d55':'#8b534e');
    for(let row=y+12;row<188;row+=13) for(let col=x+7;col<x+w-4;col+=12) {
      if((row+col)%5<3) rect(col,row,5,4,'#e39c70');
    }
  });
  rect(19,195,382,10,'#452e2c');rect(149,14,7,186,'#553333');rect(276,14,7,186,'#553333');
  rect(0,215,420,42,'#302820');rect(0,213,420,7,'#613b2b');
  rect(47,104,126,91,'#302923');rect(54,111,112,69,'#e9b96f');rect(60,117,100,57,'#f8d893');
  rect(69,126,56,5,'#ae5540');rect(69,138,78,3,'#cc8455');rect(69,147,57,3,'#cc8455');
  rect(102,194,15,16,'#302923');rect(87,208,45,5,'#302923');
  rect(192,187,28,26,'#f7dca5');rect(218,190,10,13,'#f7dca5');rect(220,193,5,7,'#b55b49');
  rect(302,161,42,10,'#352d26');rect(302,168,7,15,'#352d26');rect(337,168,7,15,'#352d26');
  rect(283,176,81,37,'#3b4d46');rect(283,176,81,17,'#52665a');rect(320,188,9,10,'#f0bc70');
}

function progress(step) {
  const shown = Math.min(step + 1,total);
  return '<div class="progress-label"><span>' + (step === total ? '本局结束' : '剧情进度') +
    '</span><span>' + shown + ' / ' + total + '</span></div><div class="segments" aria-hidden="true">' +
    order.map((_,i) => '<span class="' + (i < step ? 'done' : i === step ? 'current' : '') + '"></span>').join('') + '</div>';
}

function updateClock() {
  const remaining = closingTime - game.minute;
  byId('time').textContent = clock(game.minute);
  byId('deadline').textContent = remaining > 0 ? '距下班 ' + remaining + ' 分钟' :
    remaining === 0 ? '现在可以下班' : '已超时 ' + (-remaining) + ' 分钟';
  byId('reset').hidden = game.step === 0;
}

function renderScene(focus = true) {
  updateClock();
  const scene = scenes[order[game.step] === 'branch' ? game.branch : order[game.step]];
  play.innerHTML = progress(game.step) + '<p class="location">' + scene.place + '</p>' +
    '<h1 tabindex="-1">' + scene.title + '</h1><p class="intro">' + scene.body + '</p>' +
    '<div class="choices">' + scene.options.map(([label],i) =>
      '<button type="button" class="choice"><span class="letter">' + 'ABC'[i] +
      '</span><span>' + label + '</span><span class="arrow" aria-hidden="true">→</span></button>').join('') + '</div>';
  if (game.step === 0) {
    play.querySelector('.intro').insertAdjacentHTML('afterend',
      '<p class="intro">目标是在 18:00 前（含）离开。选择会改变剧情和耗时，读题时可以慢慢想。</p>');
  }
  play.querySelectorAll('.choice').forEach((button,i) => button.addEventListener('click', () => {
    game = choose(game,i);
    renderFeedback();
  }));
  if (focus) focusHeading();
}

function focusHeading() {
  play.querySelector('h1').focus({preventScroll:true});
  if (play.getBoundingClientRect().top < 0) play.scrollIntoView({block:'start'});
}

function renderFeedback() {
  updateClock();
  play.innerHTML = progress(game.step - 1) + '<p class="location">第 ' + game.step + ' 次选择</p>' +
    '<h1 tabindex="-1">选择结果</h1><div class="receipt"><b>' +
    (game.cost ? '+' + game.cost + ' 分钟' : '没有耽误时间') + '</b><p>' + game.feedback +
    '</p></div><button type="button" class="primary" id="next">' +
    (game.step === total ? '查看结局' : '继续下班 →') + '</button>';
  byId('next').addEventListener('click', () => game.step === total ? renderEnding() : renderScene());
  focusHeading();
}

function restart() {
  game = newGame();
  renderScene();
}

function renderEnding() {
  const ending = endings[endingFor(game)];
  const time = clock(game.minute);
  const late = Math.max(0,game.minute - closingTime);
  const result = late ? '超时 ' + late + ' 分钟' : '准时离开';
  play.innerHTML = progress(total) + '<div class="ending-card"><p class="location">下班结局 · ' + result +
    '</p><h1 tabindex="-1">' + ending.title + '</h1><p class="result-time">' + time +
    '</p><p>' + ending.line + '</p></div><div class="actions">' +
    '<button type="button" class="primary" id="replay">再玩一局 ↻</button>' +
    '<button type="button" class="secondary" id="copy">复制结局文案</button>' +
    '<button type="button" class="secondary" id="download">保存结局卡</button></div>' +
    '<p class="status" id="status" role="status" hidden></p>' +
    '<textarea id="share-text" aria-label="可手动复制的结局文案" readonly rows="4" hidden></textarea>';
  const message = '我在《' + gameTitle + '》打出了「' + ending.title + '」！' +
    time + ' 离开办公室，' + result + '。' + ending.line;
  const copyText = /^https?:$/.test(location.protocol) && !['localhost','127.0.0.1','[::1]'].includes(location.hostname) ?
    message + '\n你能准时下班吗？' + location.origin + location.pathname : message + '\n你能准时下班吗？';
  byId('replay').addEventListener('click',restart);
  byId('copy').addEventListener('click', () => copyResult(copyText));
  byId('download').addEventListener('click', () => downloadCard(ending,time,result));
  focusHeading();
}

function status(message) {
  const element = byId('status');
  if (element) {
    element.hidden = false;
    element.textContent = message;
  }
}

async function copyResult(message) {
  const field = byId('share-text');
  try {
    await navigator.clipboard.writeText(message);
    if (field.isConnected) status('已复制，可以粘贴给同事。');
  } catch {
    if (!field.isConnected) return;
    field.value = message;
    field.hidden = false;
    field.focus();
    field.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch {}
    if (copied) {
      field.hidden = true;
      byId('copy').focus();
    }
    status(copied ? '已复制，可以粘贴给同事。' : '文案已选中，可以长按或使用键盘复制。');
  }
}

function downloadCard(ending,time,result) {
  const canvas = document.createElement('canvas');
  canvas.width = 840;
  canvas.height = 1000;
  const ctx = canvas.getContext('2d');
  const font = '"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#f5efe2';ctx.fillRect(0,0,840,1000);
  ctx.fillStyle = '#282820';ctx.fillRect(52,52,736,896);
  ctx.fillStyle = '#ffd364';ctx.fillRect(52,52,736,12);
  ctx.font = 'bold 34px ' + font;ctx.fillText(gameTitle,100,138);
  ctx.drawImage(byId('office'),100,178,640,350);
  ctx.font = 'bold 28px ' + font;ctx.fillText('下班结局 · ' + result,100,592);
  ctx.fillStyle = '#fff4d8';ctx.font = 'bold 52px ' + font;ctx.fillText(ending.title,100,674,640);
  ctx.fillStyle = '#ffd364';ctx.font = 'bold 99px monospace';ctx.fillText(time,100,795);
  ctx.fillStyle = '#fff4d8';ctx.font = '32px ' + font;
  let line = '';
  let y = 866;
  for (const character of ending.line) {
    if (ctx.measureText(line + character).width > 640) {
      ctx.fillText(line,100,y);
      line = '';
      y += 43;
    }
    line += character;
  }
  ctx.fillText(line,100,y);
  canvas.toBlob(blob => {
    if (!blob) {
      status('卡片生成失败，可以重试或复制文案。');
      return;
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = '今天必须准时下班-' + ending.title + '.png';
    link.href = url;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url),30000);
  },'image/png');
}

byId('reset').addEventListener('click',restart);
drawOffice();
renderScene(false);
